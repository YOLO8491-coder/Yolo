<style>
/* ── DESIGN TOKENS ─────────────────────── */
:root {
  --bg:         #EDEEF1;
  --surface:    #FFFFFF;
  --surface-2:  #F4F5F7;
  --border:     #E0E2E8;
  --text-1:     #1B2B38;

  --teal-lt:    #EBF5F3;

  --amber-lt:   #FFF4DC;
  --danger:     #C0392B;
  --success:    #27AE60;

  --d-body:     #3D90A8;
  --d-cog:      #6B5DD3;
  --d-lang:     #3DA06C;
  --d-social:   #D4762A;
  --d-emotion:  #C4473A;
  --d-aesth:    #9E6388;

  --sidebar-w:  224px;
  --topbar-h:   54px;
  --r:          10px;
  --r-sm:       6px;
  --sh:         0 2px 8px rgba(0,0,0,.08);

}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:        #0F1A18;
    --surface:   #192825;
    --surface-2: #1F3330;
    --border:    #2A3F3C;
    --text-1:    #DEE9E7;
    --text-2:    #7CA8A0;
    --text-3:    #4E6E68;
    --teal:      #38A88E;
    --teal-lt:   #162A27;
    --teal-dk:   #0A1412;
    --amber:     #E09A10;
    --amber-lt:  #221E08;
    --sh:        0 2px 8px rgba(0,0,0,.35);
    --sh-sm:     0 1px 3px rgba(0,0,0,.25);

}

  --bg:        #0F1A18;
  --surface:   #192825;
  --surface-2: #1F3330;
  --border:    #2A3F3C;

body{font-family:'Noto Sans TC',system-ui,sans-serif;background:var(--bg);color:var(--text-1);min-height:100vh;line-height:1.6}
button{cursor:pointer;font-family:inherit;border:none;background:none}

/* ── LOGIN ─────────────────────────────── */
.login-bg{
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;width:100%;
  background:linear-gradient(135deg,#1D3430 0%,#2D5248 50%,#1A3832 100%);
}
.login-card{
  background:var(--surface);border-radius:16px;

}
.login-logo{text-align:center;margin-bottom:28px}

}

.fgroup{margin-bottom:16px}

.fgroup input{

  border-radius:var(--r-sm);font-size:14px;color:var(--text-1);
  background:var(--surface);outline:none;transition:border-color .15s;
}

  transition:background .15s;margin-top:4px;letter-spacing:.01em;
}
.btn-login:hover{background:#25695C}
.login-hint{font-size:12px;color:var(--text-3);text-align:center;margin-top:16px}

.sb-logo-name{font-size:15px;font-weight:700;color:#fff;letter-spacing:-.01em}

.sb-class{padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.07)}

.sb-class-name{font-size:13.5px;font-weight:600;color:rgba(255,255,255,.88)}
.sb-class-sub{font-size:11px;color:rgba(255,255,255,.4);margin-top:1px}

.sb-nav{flex:1;padding:10px 8px;overflow-y:auto}

}
.nav-btn:hover{color:rgba(255,255,255,.85);background:rgba(255,255,255,.07)}

.nav-icon{font-size:15px;width:20px;text-align:center;flex-shrink:0}
.nav-badge{
  margin-left:auto;background:var(--amber);
  color:#fff;font-size:10px;font-weight:700;

}

.sb-footer{padding:12px 14px;border-top:1px solid rgba(255,255,255,.07)}
.sb-teacher{display:flex;align-items:center;gap:10px}
.sb-avatar{
  width:32px;height:32px;border-radius:50%;

}
.sb-tname{font-size:13px;font-weight:500;color:rgba(255,255,255,.8)}
.sb-trole{font-size:11px;color:rgba(255,255,255,.38)}

/* Main */
.main{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column}
.topbar{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:0 24px;height:var(--topbar-h);
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:50;box-shadow:var(--sh-sm);
}
.topbar-title{font-size:15px;font-weight:600}
.topbar-right{display:flex;align-items:center;gap:12px}
.topbar-date{font-size:12.5px;color:var(--text-3)}
.topbar-theme{
  width:32px;height:32px;border-radius:var(--r-sm);
  background:var(--surface-2);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-size:15px;
  cursor:pointer;transition:background .15s;
}
.topbar-theme:hover{background:var(--teal-lt)}
.content{padding:24px;flex:1}

/* ── PAGE ELEMENTS ─────────────────────── */
.pg-hdr{margin-bottom:22px}
.pg-hdr h2{font-size:19px;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
.pg-hdr p{font-size:13.5px;color:var(--text-2);margin-top:4px}

/* Cards */
.card{background:var(--surface);border-radius:var(--r);border:1px solid var(--border);box-shadow:var(--sh-sm);overflow:hidden}
.card-hdr{padding:13px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.card-hdr h3{font-size:13.5px;font-weight:600}
.card-body{padding:18px}

/* Stats */
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:22px}
.stat-box{background:var(--surface);border-radius:var(--r);border:1px solid var(--border);padding:16px 18px;box-shadow:var(--sh-sm)}
.stat-lbl{font-size:11px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em}
.stat-val{font-size:26px;font-weight:700;color:var(--text-1);margin-top:3px;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.stat-sub{font-size:12px;color:var(--text-3);margin-top:2px}
.stat-ok{color:var(--success)}
.stat-warn{color:var(--amber)}

/* Two-col */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.three-col{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}

/* Domain pill */
.dpill{
  display:inline-flex;align-items:center;gap:4px;
  padding:2px 8px;border-radius:20px;
  font-size:10.5px;font-weight:700;color:#fff;
  letter-spacing:.02em;flex-shrink:0;
}

/* Lesson cards */
.lesson-list{display:flex;flex-direction:column;gap:10px}
.lesson-item{
  display:flex;align-items:flex-start;gap:14px;
  padding:14px 16px;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh-sm);
  cursor:pointer;transition:border-color .15s;
}
.lesson-item:hover{border-color:var(--teal)}
.lesson-date{
  font-size:11px;font-weight:600;color:var(--text-3);
  text-align:center;min-width:32px;padding-top:2px;
  font-variant-numeric:tabular-nums;
}
.lesson-body{flex:1;min-width:0}
.lesson-body h4{font-size:14px;font-weight:600}
.lesson-body p{font-size:12.5px;color:var(--text-2);margin-top:3px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lesson-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.lesson-status{
  flex-shrink:0;font-size:11px;font-weight:600;padding:3px 8px;
  border-radius:20px;align-self:flex-start;
}
.status-done{background:#E8F6EE;color:#27AE60}
.status-plan{background:var(--amber-lt);color:var(--amber)}

/* Indicator selector */
.domain-group{margin-bottom:18px}
.domain-group-hdr{
  display:flex;align-items:center;gap:8px;
  font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:8px;
}
.ind-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.ind-chip{
  border:1.5px solid var(--border);border-radius:var(--r-sm);
  padding:8px 10px;cursor:pointer;transition:all .15s;background:var(--surface);
}
.ind-chip:hover{border-color:var(--teal);background:var(--teal-lt)}
.ind-chip.sel{border-color:var(--teal);background:var(--teal-lt)}
.ind-code{font-size:10.5px;font-weight:700;color:var(--teal);font-variant-numeric:tabular-nums}
.ind-text{font-size:11.5px;color:var(--text-2);margin-top:2px;line-height:1.4}
.ind-chip.sel .ind-code{color:var(--teal)}

/* Children grid */
.child-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:12px}
.child-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);padding:16px 10px 14px;
  text-align:center;cursor:pointer;
  transition:box-shadow .15s,border-color .15s;box-shadow:var(--sh-sm);
}
.child-card:hover{border-color:var(--teal);box-shadow:var(--sh)}
.child-av{
  width:46px;height:46px;border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:17px;font-weight:700;color:#fff;margin-bottom:8px;
}
.child-name{font-size:14px;font-weight:600}
.child-cnt{font-size:11.5px;color:var(--text-3);margin-top:2px}
.child-dots{display:flex;justify-content:center;gap:3px;margin-top:7px;flex-wrap:wrap}
.cdot{width:8px;height:8px;border-radius:50%;display:inline-block}

/* Upload zone */
.upload-zone{
  border:2px dashed var(--border);border-radius:var(--r);
  padding:32px 20px;text-align:center;cursor:pointer;
  transition:all .2s;background:var(--surface-2);
}
.upload-zone:hover,.upload-zone.drag{border-color:var(--teal);background:var(--teal-lt)}
.upload-icon{font-size:36px;margin-bottom:12px;display:block}
.upload-text{font-size:14px;color:var(--text-2);font-weight:500}
.upload-sub{font-size:12px;color:var(--text-3);margin-top:5px}

/* Records */
.rec-list{display:flex;flex-direction:column;gap:9px}
.rec-item{
  display:flex;align-items:flex-start;gap:12px;
  padding:12px 14px;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--r-sm);
}
.rec-thumb{
  width:44px;height:44px;border-radius:8px;
  background:var(--surface-2);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:22px;
}
.rec-meta{flex:1;min-width:0}
.rec-meta h4{font-size:13px;font-weight:600}
.rec-meta p{font-size:12px;color:var(--text-2);margin-top:2px;line-height:1.5}
.rec-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.rtag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;color:#fff}
.rec-time{font-size:11px;color:var(--text-3);flex-shrink:0;padding-top:2px;font-variant-numeric:tabular-nums}

/* Feedback */
.msg-item{padding:14px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);margin-bottom:9px}
.msg-hdr{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.msg-av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;flex-shrink:0}
.msg-sender{font-size:13px;font-weight:600}
.msg-time{font-size:11px;color:var(--text-3);margin-left:auto}
.msg-txt{font-size:13.5px;color:var(--text-2);line-height:1.65}
.msg-photo-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--teal);font-weight:500;margin-top:7px;background:var(--teal-lt);padding:3px 8px;border-radius:20px}

/* Report */
.report-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.report-row:last-child{border:none}
.report-domain{width:100px;font-size:13px;font-weight:600;color:var(--text-1);display:flex;align-items:center;gap:7px}
.report-bar-wrap{flex:1;height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.report-bar{height:100%;border-radius:4px;transition:width .6s cubic-bezier(.25,.46,.45,.94)}
.report-pct{font-size:12px;font-weight:600;color:var(--text-2);min-width:34px;text-align:right;font-variant-numeric:tabular-nums}

/* Child detail */
.child-detail-hdr{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.cd-av{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:#fff;flex-shrink:0}
.cd-name{font-size:18px;font-weight:700}
.cd-sub{font-size:13px;color:var(--text-2);margin-top:2px}
.btn-back{font-size:13px;color:var(--text-2);display:flex;align-items:center;gap:5px;margin-bottom:16px;padding:5px 0;cursor:pointer;width:fit-content}
.btn-back:hover{color:var(--teal)}

/* Buttons */
.btn-sm{padding:7px 14px;border-radius:var(--r-sm);font-size:13px;font-weight:500}
.btn-outline{border:1.5px solid var(--border);color:var(--text-1);background:var(--surface);transition:all .15s}
.btn-outline:hover{border-color:var(--teal);color:var(--teal);background:var(--teal-lt)}
.btn-solid{background:var(--teal);color:#fff;transition:background .15s}
.btn-solid:hover{background:#25695C}
.btn-icon{width:30px;height:30px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;font-size:15px;background:var(--surface-2);border:1px solid var(--border);cursor:pointer;transition:background .15s}
.btn-icon:hover{background:var(--teal-lt)}

/* Form */
.f-label{display:block;font-size:11.5px;font-weight:600;color:var(--text-2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
.f-input{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:var(--r-sm);font-size:14px;color:var(--text-1);background:var(--surface);outline:none;transition:border-color .15s}
.f-input:focus{border-color:var(--teal)}
.f-textarea{resize:vertical;min-height:80px;line-height:1.6}
.f-row{margin-bottom:14px}

/* Tabs */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:20px}
.tab-btn{padding:10px 15px;font-size:13px;font-weight:500;color:var(--text-2);border-bottom:2px solid transparent;cursor:pointer;transition:all .15s}
.tab-btn:hover{color:var(--text-1)}
.tab-btn.active{color:var(--teal);border-bottom-color:var(--teal)}

/* Upload processing overlay */
.processing-badge{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--amber-lt);color:var(--amber);
  font-size:12px;font-weight:600;padding:5px 12px;border-radius:20px;
}
@keyframes spin{to{transform:rotate(360deg)}}
.spinning{display:inline-block;animation:spin 1s linear infinite}

/* Radar SVG — handled in JS */

/* ── RESPONSIVE ────────────────────────── */
@media(max-width:768px){
  .sidebar{transform:translateX(-100%);transition:transform .25s}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  .two-col,.three-col{grid-template-columns:1fr}
  .ind-grid{grid-template-columns:1fr}
  .stat-row{grid-template-columns:repeat(2,1fr)}
  .child-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:480px){
  .stat-row{grid-template-columns:1fr 1fr}
  .child-grid{grid-template-columns:repeat(2,1fr)}
  .content{padding:16px}
}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>

/* Coverage calculation */
function coverage(){
  const all={};
  Object.keys(DOM).forEach(d=>{
    const total=INDICATORS.filter(x=>x.d===d).length;
    const coveredInds=new Set([...S.recs.flatMap(r=>r.inds),...[...S.selInds]]);
    const done=INDICATORS.filter(x=>x.d===d&&coveredInds.has(x.id)).length;
    all[d]=Math.round(done/total*100);
  });
  return all;
}

/* Radar SVG */
function radar(cov){
  const cx=160,cy=155,mr=110;
  const keys=['身','認','語','社','情','美'];
  const angs=keys.map((_,i)=>(-90+i*60)*Math.PI/180);
  const levels=[20,40,60,80,100];

  const grid=levels.map(p=>{
    const r=p/100*mr;
    const pts=angs.map(a=>`${cx+r*Math.cos(a)},${cy+r*Math.sin(a)}`).join(' ');
    return `<polygon points="${pts}" fill="none" stroke="var(--border)" stroke-width="1"/>`;
  }).join('');

  const axes=angs.map(a=>`<line x1="${cx}" y1="${cy}" x2="${cx+mr*Math.cos(a)}" y2="${cy+mr*Math.sin(a)}" stroke="var(--border)" stroke-width="1"/>`).join('');

  const datapts=keys.map((d,i)=>{const r=cov[d]/100*mr;return `${cx+r*Math.cos(angs[i])},${cy+r*Math.sin(angs[i])}`}).join(' ');

  const dots=keys.map((d,i)=>{
    const r=cov[d]/100*mr;
    return `<circle cx="${cx+r*Math.cos(angs[i])}" cy="${cy+r*Math.sin(angs[i])}" r="4" fill="${DOM[d].color}" stroke="var(--surface)" stroke-width="1.5"/>`;
  }).join('');

  const lbls=keys.map((d,i)=>{
    const r=mr+26;const x=cx+r*Math.cos(angs[i]);const y=cy+r*Math.sin(angs[i]);
    return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="700" fill="${DOM[d].color}" font-family="Noto Sans TC,sans-serif">${d}</text>`;
  }).join('');

  const pctlbls=levels.filter((_,i)=>i===4).map(p=>{
    const r=p/100*mr;
    return `<text x="${cx}" y="${cy-r-5}" text-anchor="middle" font-size="9" fill="var(--text-3)" font-family="Noto Sans TC,sans-serif">${p}%</text>`;
  }).join('');

  return `<svg width="320" height="310" viewBox="0 0 320 310" style="max-width:100%;height:auto">
    ${grid}${axes}
    <polygon points="${datapts}" fill="rgba(44,125,110,.18)" stroke="#2C7D6E" stroke-width="2" stroke-linejoin="round"/>
    ${dots}${lbls}${pctlbls}
  </svg>`;
}

/* ── RENDER ──────────────────────────── */
function render(){
  const app=$('app');
  if(S.view==='login'){app.innerHTML=vLogin();return}
  let inner;
  switch(S.view){
    case 'dashboard': inner=vDashboard();break;
    case 'curriculum': inner=vCurriculum();break;
    case 'records': inner=vRecords();break;
    case 'feedback': inner=vFeedback();break;
    case 'report': inner=vReport();break;
    default: inner=vDashboard();
  }
  app.innerHTML=vShell(inner);
  if(S.dark)document.documentElement.setAttribute('data-theme','dark');
  else document.documentElement.removeAttribute('data-theme');
}

/* ── ACTIONS ─────────────────────────── */
function doLogin(){S.view='dashboard';render()}
function go(v){S.view=v;S.child=null;render();window.scrollTo(0,0)}
function toggleInd(id){
  if(S.selInds.has(id))S.selInds.delete(id);
  else S.selInds.add(id);
  render();
}
function toggleTheme(){
  S.dark=!S.dark;
  if(S.dark)document.documentElement.setAttribute('data-theme','dark');
  else document.documentElement.removeAttribute('data-theme');
  render();
}
function startUpload(){
  S.uploading=true;S.genComment=null;render();
  setTimeout(()=>{
    S.uploading=false;S.uploadDone=true;
    const child=S.child||1;
    S.recs.push({id:Date.now(),cid:child,emoji:'🎨',title:'積木建築作品（新上傳）',
      desc:'孩子今日積木搭建作品，展現對家屋結構的理解與空間思維。',
      inds:['認-大-2-1-1','美-大-2-2-1','語-大-2-2-1'],time:'now'});
    render();
  },2000);
}

const COMMENTS=[
  '幼兒在今日「我的家」課程中，主動拿取積木嘗試搭建房屋結構，過程中能依據高低、大小做初步分類（認-大-2-1-1），並以蠟筆在作品旁添加裝飾，展現對視覺藝術素材的主動探索（美-大-2-2-1）。分享時能簡短說明自己的設計意圖，語言表達清楚流暢（語-大-2-2-1）。建議下次活動可提供更多不同形狀的積木，進一步延伸空間建構的挑戰性。',
  '本次記錄顯示幼兒在小組合作搭建中積極參與，能與同伴討論分工，說出「我負責做門，你做屋頂」等協商語句（語-大-2-3-1）。對於作品的顏色選擇有明顯偏好，使用暖色調呈現家的溫馨感，展現豐富的美感覺察（美-大-1-1-1）。整體而言，社會互動技巧和情緒穩定性均有良好表現。',
  '幼兒今日在作品分享環節中，能用完整句子描述自己的家，加入「因為我家有很多樹」等個人觀點（語-大-2-3-1），語言邏輯清晰。積木排列具有一定規律性，顯示認知分類能力正在發展（認-大-2-1-1）。情緒方面，分享時神情愉快，能在適當時機表達開心（情-大-2-1-1）。',
];

function genComment(){
  const box=document.getElementById('comment-box');
  if(!box)return;
  box.innerHTML='<span style="color:var(--text-3)"><span class="spinning" style="display:inline-block;animation:spin 1s linear infinite">⏳</span> AI 正在分析記錄內容並生成評語…</span>';
  setTimeout(()=>{
    S.genComment=COMMENTS[Math.floor(Math.random()*COMMENTS.length)];
    box.innerHTML=`<div style="font-size:13.5px;line-height:1.75;color:var(--text-1)">${S.genComment}</div>
    <div style="margin-top:8px;font-size:11px;color:var(--text-3)">🤖 依據：今日課程主題「我的家」・已對應課綱指標自動生成</div>`;
  },1600);
}

function copyComment(){
  if(!S.genComment){alert('請先點擊「生成評語」');return}
  navigator.clipboard.writeText(S.genComment).then(()=>alert('✅ 評語已複製到剪貼板！'));
}

/* ── INIT ────────────────────────────── */
render();
</script>
